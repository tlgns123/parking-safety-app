<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파킹안심 - 마이페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen sm:py-6">

    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] sm:max-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-700">
        
        <header class="bg-slate-900 text-white px-5 py-3.5 flex justify-between items-center z-10 border-b border-slate-800">
            <div class="flex items-center gap-2.5">
                <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-2 rounded-xl text-lg flex items-center justify-center w-9 h-9 shadow-md">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-black text-base tracking-tight text-slate-100">파킹안심</h1>
                        <span class="text-[9px] bg-blue-900/80 text-blue-300 px-1.5 py-0.2 rounded border border-blue-700/50 font-semibold">마이페이지</span>
                    </div>
                    <p class="text-[10px] text-slate-400">내 차 등록 & 안심번호 관리</p>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto relative bg-slate-100 p-4 space-y-3.5" id="mainContent">
            
            <!-- Profile & Safe Status Summary Card -->
            <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-4 rounded-2xl shadow-md space-y-2.5">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-lg font-bold text-white shadow">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>
                        <div>
                            <h2 class="text-xs font-bold text-slate-100">안심 운전자 프로필</h2>
                            <p class="text-[10px] text-blue-300">개인정보 암호화 수신 중</p>
                        </div>
                    </div>
                    <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] px-2.5 py-1 rounded-full font-bold">
                        <i class="fa-solid fa-check-double mr-1"></i>안심망 가입됨
                    </span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-center">
                    <div class="bg-slate-800/60 p-2 rounded-xl">
                        <p class="text-[10px] text-slate-400">등록 차량</p>
                        <p class="text-sm font-black text-blue-400" id="myPageCarCount">0대</p>
                    </div>
                    <div class="bg-slate-800/60 p-2 rounded-xl">
                        <p class="text-[10px] text-slate-400">우선주차 가점</p>
                        <p class="text-sm font-black text-amber-400" id="myPagePoints">+5점</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="border-b border-slate-100 pb-2 flex justify-between items-center">
                    <div>
                        <h2 class="text-xs font-bold text-slate-900">내 차 등록 & 안심번호 발급</h2>
                        <p class="text-[10px] text-slate-500">차량 번호와 안심 가상번호를 연결합니다.</p>
                    </div>
                    <i class="fa-solid fa-car-side text-blue-600 text-lg"></i>
                </div>

                <form id="formRegisterCar" onsubmit="handleCarRegistration(event)" class="space-y-2.5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">차량 번호 <span class="text-red-500">*</span></label>
                        <input type="text" id="regPlate" required placeholder="예: 123가 4567" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700 mb-1">차종</label>
                            <input type="text" id="regModel" placeholder="예: 그랜저, 아반떼" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700 mb-1">색상</label>
                            <input type="text" id="regColor" placeholder="예: 흰색, 검정" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">연락처 (본인인증 연동) <span class="text-red-500">*</span></label>
                        <input type="tel" id="regPhone" required placeholder="010-0000-0000" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">주 거주구역 / 안내 메모</label>
                        <input type="text" id="regNote" placeholder="예: 거주자우선 08번 / 부재시 사이드 해제됨" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl transition-all text-xs shadow-md mt-1 flex justify-center items-center gap-1.5">
                        <i class="fa-solid fa-shield-halved"></i> 안심번호 발급받기
                    </button>
                </form>
            </div>

            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
                <h3 class="text-xs font-bold text-slate-800 flex justify-between items-center">
                    <span><i class="fa-solid fa-list text-blue-600 mr-1"></i>등록된 내 차량 목록</span>
                    <span id="myCarCount" class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-bold">0대</span>
                </h3>
                <div id="myCarList" class="space-y-2"></div>
            </div>

            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <h3 class="text-xs font-bold text-slate-800 flex justify-between items-center">
                    <span><i class="fa-solid fa-clock-rotate-left text-slate-600 mr-1"></i>최근 이용 & 연락 이력</span>
                </h3>
                <div id="historyList" class="space-y-2"></div>
            </div>
        </main>

        <nav class="bg-white border-t border-slate-200 px-4 py-2 flex justify-around items-center z-10" aria-label="하단 메뉴">
            <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 font-bold text-[10px] hover:text-blue-600 transition-all">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
                <span>차주 연결</span>
            </a>
            <a href="talktalk.html" class="flex flex-col items-center gap-1 text-slate-400 font-bold text-[10px] hover:text-blue-600 transition-all">
                <i class="fa-solid fa-comments text-lg"></i>
                <span>안심 톡톡</span>
            </a>
            <a href="mypage.html" class="flex flex-col items-center gap-1 text-blue-700 font-bold text-[10px] transition-all">
                <i class="fa-solid fa-user text-lg"></i>
                <span>마이페이지</span>
            </a>
        </nav>

        <div id="toast" class="absolute top-14 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-xs px-4 py-2.5 rounded-full shadow-xl transition-all opacity-0 pointer-events-none duration-300 z-50 flex items-center gap-2 border border-slate-700">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMsg">알림 메시지</span>
        </div>
    </div>

    <script>
        let carDatabase = [];
        let callLogs = [];

        window.onload = function() {
            const savedDb = localStorage.getItem('parking_safe_db');
            carDatabase = savedDb ? JSON.parse(savedDb) : [];

            const savedLogs = localStorage.getItem('parking_safe_logs');
            callLogs = savedLogs ? JSON.parse(savedLogs) : [];

            renderMyCars();
            renderHistory();
        };

        function saveDb() {
            localStorage.setItem('parking_safe_db', JSON.stringify(carDatabase));
        }

        function handleCarRegistration(event) {
            event.preventDefault();
            
            const plate = document.getElementById('regPlate').value.trim();
            const model = document.getElementById('regModel').value.trim() || '미지정 모델';
            const color = document.getElementById('regColor').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const note = document.getElementById('regNote').value.trim();

            if (!plate || !phone) {
                showToast("차량 번호와 연락처는 필수입니다.");
                return;
            }

            const randomPart1 = Math.floor(1000 + Math.random() * 9000);
            const randomPart2 = Math.floor(1000 + Math.random() * 9000);
            const safeNum = `0504-${randomPart1}-${randomPart2}`;
            const fullModel = color ? `${model} (${color})` : model;

            const newCar = {
                plate: plate,
                model: fullModel,
                phone: phone,
                safeNum: safeNum,
                note: note || '등록 메모 없음',
                isMyCar: true,
                points: 5
            };

            carDatabase.unshift(newCar);
            saveDb();

            document.getElementById('formRegisterCar').reset();
            renderMyCars();
            showToast("안심번호 발급 완료! 거주자 우선주차 가점(+5점)이 반영되었습니다.");
        }

        function renderMyCars() {
            const container = document.getElementById('myCarList');
            const countBadge = document.getElementById('myCarCount');
            const myPageCount = document.getElementById('myPageCarCount');
            const myCars = carDatabase.filter(c => c.isMyCar);

            if (countBadge) countBadge.innerText = `${myCars.length}대`;
            if (myPageCount) myPageCount.innerText = `${myCars.length}대`;
            
            container.innerHTML = '';

            if (myCars.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 py-3 text-center">등록된 내 차량이 없습니다.</p>`;
                return;
            }

            myCars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="font-extrabold text-slate-900 text-xs">${car.plate}</span>
                            <span class="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded border border-emerald-200">가점 +5점</span>
                        </div>
                        <p class="text-[11px] text-slate-500 mt-0.5">${car.model}</p>
                        <p class="text-[11px] text-blue-700 font-bold font-mono"><i class="fa-solid fa-shield-halved mr-1"></i>${car.safeNum}</p>
                    </div>
                    <button onclick="deleteMyCar('${car.plate}')" class="text-slate-400 hover:text-red-500 text-xs p-2">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function deleteMyCar(plate) {
            carDatabase = carDatabase.filter(c => c.plate !== plate);
            saveDb();
            renderMyCars();
            showToast("등록 차량을 삭제했습니다.");
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (!container) return;
            container.innerHTML = '';

            if (callLogs.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 py-4 text-center">이용 내역이 없습니다.</p>`;
                return;
            }

            callLogs.forEach(log => {
                const isGov = log.action.includes('주차 단속');
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl border flex justify-between items-center text-xs ${isGov ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200'}`;
                item.innerHTML = `
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="font-bold text-slate-900">${log.plate}</span>
                            <span class="text-[10px] font-bold px-1.5 py-0.2 rounded ${isGov ? 'bg-red-200 text-red-800' : 'bg-blue-100 text-blue-800'}">${log.status}</span>
                        </div>
                        <p class="text-[11px] ${isGov ? 'text-red-700 font-semibold' : 'text-blue-700'} mt-0.5">${log.action}</p>
                    </div>
                    <span class="text-[10px] text-slate-400">${log.time}</span>
                `;
                container.appendChild(item);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2500);
        }
    </script>
</body>
</html>
